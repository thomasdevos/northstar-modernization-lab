name: verify starter lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  starter-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""
      - name: Report tool versions
        run: |
          python3 --version
          make --version | sed -n '1p'
      - name: Run passing gates
        run: |
          make test
          make policy
          make baseline
          make characterize
      - name: Confirm intentional comparator failure
        shell: bash
        run: |
          set +e
          make compare >"$RUNNER_TEMP/compare.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/compare.log"
          test "$status" -ne 0
          grep -F "STL-1002" "$RUNNER_TEMP/compare.log"
      - name: Confirm aggregate gate exposes the starter gap
        shell: bash
        run: |
          set +e
          make verify >"$RUNNER_TEMP/verify.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/verify.log"
          test "$status" -ne 0
          grep -F "[0, 0, 1]" "$RUNNER_TEMP/verify.log"
      - name: Clean generated evidence and verify tracked state
        run: |
          make clean
          test -z "$(git status --porcelain --untracked-files=no)"
